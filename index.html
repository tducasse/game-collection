<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My games</title>
<meta name="description" content="Everything I can play, and whether it works on GeForce NOW.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>My games</h1>
    <p id="summary" class="summary"></p>
  </div>

  <input id="q" type="search" placeholder="Do I have…" autocomplete="off" spellcheck="false" aria-label="Search games">

  <div class="segments" role="group" aria-label="GeForce NOW availability">
    <button class="seg is-active" data-gfn="all">All <span class="n"></span></button>
    <button class="seg" data-gfn="yes">On GFN <span class="n"></span></button>
    <button class="seg" data-gfn="no">Not on GFN <span class="n"></span></button>
  </div>
</header>

<main>
  <div class="toolbar">
    <select id="genre" aria-label="Genre"><option value="">All genres</option></select>

    <div class="menu" id="stores">
      <button class="menu-btn" id="stores-btn" aria-haspopup="true" aria-expanded="false">
        Stores <span class="menu-count"></span>
      </button>
      <div class="menu-pop" hidden>
        <div class="menu-head">
          <button type="button" data-stores="all">All</button>
          <button type="button" data-stores="none">None</button>
        </div>
        <div class="menu-list" id="stores-list"></div>
      </div>
    </div>

    <select id="access" aria-label="Access">
      <option value="all">Owned + Game Pass</option>
      <option value="owned">Owned</option>
      <option value="gp">On Game Pass</option>
    </select>
    <select id="sort" aria-label="Sort by">
      <option value="community">Best community</option>
      <option value="critic">Best critics</option>
      <option value="name">A–Z</option>
      <option value="year">Newest</option>
    </select>
    <span id="count" class="count"></span>
  </div>

  <p id="chips" class="chips" hidden></p>
  <p id="note" class="note" hidden></p>

  <div id="cards" class="cards"></div>
  <p id="empty" class="empty" hidden>Nothing here.</p>
</main>

<footer>
  <span id="meta"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
