<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My games</title>
<meta name="description" content="Everything I can play, and whether it works on GeForce NOW.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>My games</h1>
    <p id="summary" class="summary"></p>
  </div>
  <div class="search-wrap">
    <input id="q" type="search" placeholder="Do I have…" autocomplete="off" spellcheck="false" aria-label="Search games">
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="all">Everything</button>
    <button class="tab" data-view="tv">Play on the TV</button>
    <button class="tab" data-view="laptop">Laptop only</button>
    <button class="tab" data-view="gamepass">Game Pass extras</button>
  </nav>
</header>

<main>
  <div id="verdict"></div>

  <div class="controls" id="controls">
    <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
    <select id="store" aria-label="Store"><option value="">All stores</option></select>
    <select id="sort" aria-label="Sort">
      <option value="name">A–Z</option>
      <option value="recent">Recently played</option>
      <option value="playtime">Most played</option>
    </select>
    <span id="count" class="count"></span>
  </div>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>Nothing here.</p>
</main>

<footer>
  <span id="meta"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
